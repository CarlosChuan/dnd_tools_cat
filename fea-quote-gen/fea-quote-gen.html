<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8" />
    <title>Generador de Cites de FE:A</title>
    <link rel="stylesheet" type="text/css" href="quotegen-style.css">
    <link rel="shortcut icon" type="image/x-icon" href="feimages/favicon.ico" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="quotegen-script.js"></script>
	
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-145234284-1"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'UA-145234284-1');
	</script>

</head>

<body>
    <div class="container">
        <div id="kofiheader">
            <br>
            <script src="https://ko-fi.com/widgets/widget_2.js"></script>
            <script>
                kofiwidget2.init("Dona suport a Ko-fi", "#46b798", "Q5Q8MRF6");
                kofiwidget2.draw();
            </script>
        </div>
        <div class="content">
            <h1>Generador de Cites de Fire Emblem: Awakening</h1>
            <div>Aquest generador està dissenyat per ser utilitzat amb els spritesheets de <a href="http://feaspritestuff.tumblr.com/sheets">feaspritestuff</a>.</div>
            <br>
            <hr>
            <br><canvas id="image-canvas"></canvas><br><br>
            <form id="options-form">
                <table id="normal-options">
                    <tr id="lp-options">
                        <td class="left-align fixed-width-td">
                            <img src="feimages/remove.png" class="x-button" id="lp-remove" title="Eliminar Retrat">
                            <label for="lp">Retrat Esquerre:</label>
                        </td>
                        <td class="left-align"><input type="file" id="lp">
                        </td>
                        <td class="right-align">
                            <label for="lp-flip">Invertir<input type="checkbox" id="lp-flip"></label>
                            <label for="lp-sprite-index">Índex de Sprite:<input type="number" id="lp-sprite-index" min="1" max="999" value="1" disabled></label><br>
                        </td>
                    </tr>
                    <tr id="rp-options">
                        <td class="left-align fixed-width-td">
                            <img src="feimages/remove.png" class="x-button" id="rp-remove" title="Eliminar Retrat">
                            <label for="rp">Retrat Dret:</label>
                        </td>
                        <td class="left-align">
                            <input type="file" id="rp">
                        </td>
                        <td class="right-align">
                            <label for="rp-flip">Invertir<input type="checkbox" id="rp-flip"></label>
                            <label for="rp-sprite-index">Índex de Sprite:<input type="number" id="rp-sprite-index" min="1" max="999" value="1" disabled></label><br>
                        </td>
                    </tr>
                </table>
                <br>
                <div id="name-option" class="dialogue-input">
                    <label for="name">Nom: <input type="text" id="name" maxlength="255" style="width: 10rem;"></label><br>
                </div>
                <div id="dialogue-option-1" class="dialogue-input">
                    <label for="dialogue-1">Línia 1: <input type="text" id="dialogue-1" maxlength="255" style="width: 25rem;"></label><br>
                </div>
                <div id="dialogue-option-2" class="dialogue-input">
                    <label for="dialogue-2">Línia 2: <input type="text" id="dialogue-2" maxlength="255" style="width: 25rem;"></label><br>
                </div>
                <div id="box-location-option">
                    <label for="l-box-radio">Esquerra<input type="radio" name="box-location" id="l-box-radio"></label>&nbsp;&nbsp;
                    <label for="r-box-radio">Dreta<input type="radio" name="box-location" id="r-box-radio"></label>&nbsp;&nbsp;
                    <label for="no-box-radio">Sense Quadre de Text<input type="radio" name="box-location" id="no-box-radio"></label>
                </div>
                <hr>
                <b>Opcions Addicionals:</b>
                <table id="advanced-options">
                    <tr id="bkg-options">
                        <td class="left-align fixed-width-td">
                            <img src="feimages/remove.png" class="x-button" id="remove-bkg" title="Restaurar Fons per Defecte">
                            <label for="bkg">Fons:</label>
                        </td>
                        <td colspan="2" class="left-align">
                            <input type="file" id="bkg"><br>
                        </td>
                    </tr>
                    <tr id="lp2-options">
                        <td class="left-align fixed-width-td">
                            <img src="feimages/remove.png" class="x-button" id="lp2-remove" title="Eliminar Retrat">
                            <label for="lp2">Retrat Esquerre 2:</label>
                        </td>
                        <td class="left-align">
                            <input type="file" id="lp2">
                        </td>
                        <td class="right-align">
                            <label for="lp2-flip">Invertir<input type="checkbox" id="lp2-flip"></label>
                            <label for="lp2-sprite-index">Índex de Sprite:<input type="number" id="lp2-sprite-index" min="1" max="999" value="1" disabled></label><br>
                        </td>
                    </tr>
                    <tr id="rp2-options">
                        <td class="left-align fixed-width-td">
                            <img src="feimages/remove.png" class="x-button" id="rp2-remove" title="Eliminar Retrat">
                            <label for="rp2">Retrat Dret 2:</label>
                        </td>
                        <td class="left-align">
                            <input type="file" id="rp2">
                        </td>
                        <td class="right-align">
                            <label for="rp2-flip">Invertir<input type="checkbox" id="rp2-flip"></label>
                            <label for="rp2-sprite-index">Índex de Sprite:<input type="number" id="rp2-sprite-index" min="1" max="999" value="1" disabled></label><br>
                        </td>
                    </tr>
                </table>
                <br>
                <div id="box-type-option" class="advanced-option">
                    <b>Tipus de Quadre:</b>&nbsp;&nbsp;
                    <label for="type-1-radio">Tipus 1<input type="radio" name="box-type" id="type-1-radio"></label>&nbsp;&nbsp;
                    <label for="type-2-radio">Tipus 2<input type="radio" name="box-type" id="type-2-radio"></label>&nbsp;&nbsp;
                    <label for="type-3-radio">Tipus 3<input type="radio" name="box-type" id="type-3-radio"></label>&nbsp;&nbsp;
                    <label for="type-4-radio">Tipus 4<input type="radio" name="box-type" id="type-4-radio"></label>&nbsp;&nbsp;
                    <label for="type-5-radio">Tipus 5<input type="radio" name="box-type" id="type-5-radio"></label>
                </div>
                <div id="darken-portrait-options" class="advanced-option">
                    <b>Enfosquir:</b>&nbsp;&nbsp;
                    <label for="lp-darken">Esquerra<input type="checkbox" id="lp-darken"></label>&nbsp;&nbsp;
                    <label for="rp-darken">Dreta<input type="checkbox" id="rp-darken"></label>&nbsp;&nbsp;
                    <label for="lp2-darken">Esquerra 2<input type="checkbox" id="lp2-darken"></label>&nbsp;&nbsp;
                    <label for="rp2-darken">Dreta 2<input type="checkbox" id="rp2-darken"></label>
                </div>
                <div id="darken-bkg-option" class="advanced-option">
                    <label for="darken-bkg"><b>Enfosquir Fons?</b> <input type="checkbox" id="darken-bkg"></label>
                </div>
            </form>
            <div id="footer">
                Recursos de <a href="http://incorrectfeaquotes.tumblr.com/tagged/resources">aquí</a> | <a href="https://github.com/Tetra-cube/Tetra-cube.github.io">Repositori GitHub</a> | Versió 1.6
            </div>
        </div>
    </div>
</body>

</html>
